<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Attendance Preview · Phone & Tablet</title><style>
*{box-sizing:border-box}body{margin:0;background:#eee8e4;color:#4f2539;font-family:"Avenir Next",Avenir,Arial,sans-serif}header{position:sticky;top:0;z-index:2;background:#fffaf7;border-bottom:1px solid #e4c6bf;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}h1{font-size:18px;margin:0 0 3px}p{font-size:12px;margin:0;color:#785e66}.sizes{display:flex;gap:4px;background:#f3e1dc;padding:4px;border-radius:12px}.sizes button{min-height:44px;padding:8px 18px;border:0;border-radius:9px;background:transparent;color:#60233f;font:700 14px inherit;cursor:pointer}.sizes button[aria-pressed=true]{background:#dba99f;box-shadow:0 1px 3px #6b3c3222}main{padding:18px 12px;overflow:hidden;display:flex;justify-content:center}.device-space{position:relative;flex-shrink:0}.device{position:absolute;top:0;left:0;transform-origin:top left;padding:7px;background:#d7bcb5;border-radius:28px;box-shadow:0 8px 30px #54343a24}.device iframe{display:block;border:0;border-radius:21px;background:#fffaf7}footer{text-align:center;padding:8px 12px 20px;font-size:12px;color:#785e66}@media(max-width:450px){header{justify-content:center;text-align:center}.sizes{width:100%}.sizes button{flex:1}}
</style></head><body><header><div><h1>Attendance Preview</h1><p>Sample dancers · nothing published</p></div><nav class="sizes" aria-label="Preview screen size"><button data-size="phone" aria-pressed="true">Phone</button><button data-size="tablet" aria-pressed="false">Tablet</button></nav></header><main><div class="device-space"><div class="device"><iframe id="device-preview" title="Interactive attendance preview" src="./?tour=1&amp;attendance-preview=1&amp;view=device&amp;show-combine=1"></iframe></div></div></main><footer id="device-caption">Phone · upright</footer><script>
const sizes={phone:[390,844],tablet:[768,1024]};let selected='phone';
const frame=document.getElementById('device-preview'),device=document.querySelector('.device'),space=document.querySelector('.device-space');
function fit(){const [width,height]=sizes[selected],fullWidth=width+14,fullHeight=height+14,scale=Math.min(1,(document.documentElement.clientWidth-24)/fullWidth);frame.style.width=width+'px';frame.style.height=height+'px';device.style.width=fullWidth+'px';device.style.height=fullHeight+'px';device.style.transform='scale('+scale+')';space.style.width=(fullWidth*scale)+'px';space.style.height=(fullHeight*scale)+'px';document.getElementById('device-caption').textContent=(selected==='phone'?'Phone':'Tablet')+' · upright';}
document.querySelectorAll('[data-size]').forEach(button=>button.addEventListener('click',()=>{selected=button.dataset.size;document.querySelectorAll('[data-size]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));fit();}));window.addEventListener('resize',fit);fit();
</script></body></html>
